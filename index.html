<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>桜井・森香ノート研究室 - 精油檢測記錄系統</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="森香研究室">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    input[type="radio"]:checked + div {
      border-color: currentColor;
      background-color: var(--checked-bg, #f3f4f6);
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased pb-12">

  <header class="bg-slate-800 text-white p-3 sticky top-0 z-50 shadow flex justify-between items-center">
    <div class="flex items-center gap-2">
      <img src="LOGO.png" alt="Logo" class="w-9 h-9 rounded-full object-cover bg-white border border-slate-600">
      <h1 class="font-bold text-base tracking-wide">桜井・森香ノート研究室 - 精油檢測記錄系統</h1>
    </div>
    <span id="recordCount" class="text-xs bg-slate-700 px-2 py-1 rounded whitespace-nowrap">0 筆記錄</span>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">

    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div id="reader" class="w-full hidden rounded-lg overflow-hidden mb-3"></div>
      <button id="scanBtn" onclick="toggleScanner()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg flex items-center justify-center gap-2 shadow transition">
        <span class="text-lg">📷</span> <span id="scanBtnText">掃描玻片 QR Code</span>
      </button>
    </div>

    <form id="recordForm" onsubmit="saveRecord(event)" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-4">
      <h2 class="font-bold text-gray-700 text-sm border-b pb-2">🧪 檢測數據登記</h2>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">樣本編號</label>
        <input type="text" id="sampleId" required placeholder="掃碼或手動輸入" class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-gray-50">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">檢測日期</label>
          <input type="date" id="testDate" required class="w-full p-2.5 border rounded-md text-sm bg-gray-50">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">採樣時間</label>
          <input type="time" id="sampleTime" required class="w-full p-2.5 border rounded-md text-sm bg-gray-50">
        </div>
      </div>

      <!-- 新增：精油與品牌 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">精油</label>
          <input type="text" id="oilName" required placeholder="例如：真實薰衣草" class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-gray-50">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">品牌</label>
          <input type="text" id="brandName" required placeholder="例如：Florihana" class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-gray-50">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">折射率 (20°C)</label>
        <input type="number" step="0.0001" id="refractiveIndex" placeholder="例如 1.4720" class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-gray-50">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">結果 / 判定</label>
        <div class="flex gap-2">
          <label class="flex-1 cursor-pointer">
            <input type="radio" name="testResult" value="合格" class="sr-only" required>
            <div class="text-center py-2 border rounded-md text-sm text-gray-500 transition hover:bg-gray-50" style="--checked-bg: #dcfce7; color: #15803d;">
              合格
            </div>
          </label>
          <label class="flex-1 cursor-pointer">
            <input type="radio" name="testResult" value="不合格" class="sr-only">
            <div class="text-center py-2 border rounded-md text-sm text-gray-500 transition hover:bg-gray-50" style="--checked-bg: #fee2e2; color: #b91c1c;">
              不合格
            </div>
          </label>
          <label class="flex-1 cursor-pointer">
            <input type="radio" name="testResult" value="複檢" class="sr-only">
            <div class="text-center py-2 border rounded-md text-sm text-gray-500 transition hover:bg-gray-50" style="--checked-bg: #fef3c7; color: #b45309;">
              複檢
            </div>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">備註 (選填)</label>
        <textarea id="remarks" rows="3" placeholder="請輸入檢測狀況或備註事項（約60-80字）..." class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm resize-none bg-gray-50"></textarea>
      </div>

      <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm transition shadow-sm">
        儲存記錄
      </button>
    </form>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
      <h2 class="font-bold text-gray-700 text-sm border-b pb-2">📂 資料庫備份與管理</h2>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="exportCSV()" class="py-2.5 bg-gray-100 hover:bg-gray-200 border text-xs font-medium rounded-md text-gray-700 transition">
          匯出 CSV (Excel)
        </button>
        <button onclick="exportJSON()" class="py-2.5 bg-gray-100 hover:bg-gray-200 border text-xs font-medium rounded-md text-gray-700 transition">
          完整備份 (JSON)
        </button>
      </div>
      <label class="block text-center py-3 bg-gray-50 hover:bg-gray-100 border border-dashed border-gray-300 rounded-md text-xs text-gray-500 cursor-pointer transition">
        <span>📥 還原備份 (讀取 JSON 檔)</span>
        <input type="file" accept=".json" onchange="importJSON(event)" class="hidden">
      </label>
    </div>

    <div class="space-y-2 pb-6">
      <h2 class="font-bold text-gray-700 text-sm px-1">📝 本機檢測清單</h2>
      <div id="recordsList" class="space-y-2">
        <!-- 動態渲染清單 -->
      </div>
    </div>

  </main>

  <script>
    const DB_KEY = 'essential_oil_records';
    let html5QrCode = null;
    let isScanning = false;

    function initDefaults() {
      const now = new Date();
      document.getElementById('testDate').value = now.toISOString().split('T')[0];
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('sampleTime').value = `${hours}:${mins}`;
    }

    function toggleScanner() {
      const readerElem = document.getElementById('reader');
      const btnText = document.getElementById('scanBtnText');

      if (isScanning) {
        html5QrCode.stop().then(() => {
          readerElem.classList.add('hidden');
          btnText.innerText = "掃描玻片 QR Code";
          isScanning = false;
        });
      } else {
        readerElem.classList.remove('hidden');
        btnText.innerText = "關閉相機";
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            document.getElementById('sampleId').value = decodedText;
            initDefaults();
            if (navigator.vibrate) navigator.vibrate(100);
            toggleScanner();
          },
          () => {} 
        ).catch(err => {
          alert("無法啟動相機，請確認已授權 Safari 相機權限。");
          readerElem.classList.add('hidden');
          btnText.innerText = "掃描玻片 QR Code";
          isScanning = false;
        });
        isScanning = true;
      }
    }

    function getStoredData() {
      return JSON.parse(localStorage.getItem(DB_KEY) || '[]');
    }

    function saveRecord(e) {
      e.preventDefault();
      
      const selectedResult = document.querySelector('input[name="testResult"]:checked');
      if (!selectedResult) {
        alert("請選擇檢測結果判定！");
        return;
      }

      const records = getStoredData();
      const newEntry = {
        id: Date.now(),
        sampleId: document.getElementById('sampleId').value.trim(),
        oilName: document.getElementById('oilName').value.trim(),
        brandName: document.getElementById('brandName').value.trim(),
        testDate: document.getElementById('testDate').value,
        sampleTime: document.getElementById('sampleTime').value,
        refractiveIndex: document.getElementById('refractiveIndex').value,
        testResult: selectedResult.value,
        remarks: document.getElementById('remarks').value.trim(),
        createdAt: new Date().toISOString()
      };

      records.unshift(newEntry);
      localStorage.setItem(DB_KEY, JSON.stringify(records));
      
      // 清空部分欄位，保留日期時間方便連續輸入
      document.getElementById('sampleId').value = '';
      document.getElementById('oilName').value = '';
      document.getElementById('brandName').value = '';
      document.getElementById('refractiveIndex').value = '';
      document.getElementById('remarks').value = '';
      document.querySelectorAll('input[name="testResult"]').forEach(r => r.checked = false);
      
      renderList();
      if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
      alert("記錄已儲存！");
    }

    function deleteRecord(id) {
      if (!confirm("確定刪除此記錄？")) return;
      let records = getStoredData();
      records = records.filter(r => r.id !== id);
      localStorage.setItem(DB_KEY, JSON.stringify(records));
      renderList();
    }

    function renderList() {
      const records = getStoredData();
      document.getElementById('recordCount').innerText = `${records.length} 筆記錄`;
      const container = document.getElementById('recordsList');
      container.innerHTML = '';

      if (records.length === 0) {
        container.innerHTML = '<div class="text-center text-xs text-gray-400 py-6">目前暫無檢測記錄</div>';
        return;
      }

      records.forEach(r => {
        let resultColor = 'text-gray-900';
        if(r.testResult === '合格') resultColor = 'text-green-700';
        if(r.testResult === '不合格') resultColor = 'text-red-600';
        if(r.testResult === '複檢') resultColor = 'text-amber-600';

        const remarkHtml = r.remarks ? `<div class="mt-2 text-gray-500 bg-gray-50 p-2 rounded border border-gray-100">${r.remarks}</div>` : '';

        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm text-xs relative";
        card.innerHTML = `
          <div class="flex justify-between items-center pr-6 mb-1">
            <span class="font-bold text-sm text-blue-700"># ${r.sampleId}</span>
            <span class="text-gray-400">${r.testDate} ${r.sampleTime}</span>
          </div>
          <div class="text-gray-700 font-medium mb-2 text-[13px]">
            🧴 ${r.brandName || '--'} - ${r.oilName || '--'}
          </div>
          <div class="grid grid-cols-2 text-gray-600 pt-1 border-t">
            <div class="py-1">折射率: <span class="font-mono text-gray-900">${r.refractiveIndex || '--'}</span></div>
            <div class="py-1">結果: <span class="font-bold ${resultColor}">${r.testResult}</span></div>
          </div>
          ${remarkHtml}
          <button onclick="deleteRecord(${r.id})" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 text-sm font-bold transition">✕</button>
        `;
        container.appendChild(card);
      });
    }

    function exportCSV() {
      const records = getStoredData();
      if (!records.length) return alert("目前沒有可匯出的數據");

      const header = ["樣本編號", "精油", "品牌", "日期", "採樣時間", "折射率", "結果", "備註", "建立時間"];
      const rows = records.map(r => [
        `"${r.sampleId}"`,
        `"${r.oilName || ''}"`,
        `"${r.brandName || ''}"`,
        `"${r.testDate}"`,
        `"${r.sampleTime}"`,
        `"${r.refractiveIndex}"`,
        `"${r.testResult}"`,
        `"${(r.remarks || '').replace(/"/g, '""')}"`,
        `"${r.createdAt}"`
      ]);

      const csvContent = "\uFEFF" + [header.join(','), ...rows.map(e => e.join(','))].join('\n');
      downloadFile(csvContent, `桜井森香研究室_檢測記錄_${new Date().toISOString().split('T')[0]}.csv`, 'text/csv;charset=utf-8;');
    }

    function exportJSON() {
      const records = getStoredData();
      if (!records.length) return alert("目前沒有可備份的數據");
      const content = JSON.stringify(records, null, 2);
      downloadFile(content, `backup_morika_lab_${new Date().toISOString().split('T')[0]}.json`, 'application/json');
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            if (confirm(`讀取成功！即將匯入 ${imported.length} 筆資料，這將與現有數據合併。確定嗎？`)) {
              const current = getStoredData();
              const merged = [...imported, ...current];
              const unique = Array.from(new Map(merged.map(item => [item.id, item])).values());
              localStorage.setItem(DB_KEY, JSON.stringify(unique));
              renderList();
              alert("資料還原成功！");
            }
          } else {
            alert("檔案格式不相符。");
          }
        } catch (err) {
          alert("讀取檔案失敗，請確保為有效的 JSON 備份檔。");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    initDefaults();
    renderList();
  </script>
</body>
</html>
